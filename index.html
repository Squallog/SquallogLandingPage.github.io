<!DOCTYPE html>
<html lang="en-gb">
    <head>   
        <meta charset="UTF-8">
        <meta name="description" content="Jeremy Goldsworthy - Sound recordist and post-production.">
        <meta name="keywords" content="Sound Recordist, Post-Production, United Kingdom, England, AV">
        <meta name="author" content="Jeremy Goldsworthy">
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/styles/main.css">
        <title>Jeremy Goldsworthy - Sound Recording and Post Processing</title>
        <script src="./assets/scripts/audio.js"></script>
        <script src="./assets/scripts/barCSS.js" defer></script>
        <!-- <script src="./assets/scripts/controls.js" defer></script> -->
        <script src="./assets/scripts/gubbins.js" defer></script>
        <script src="./assets/scripts/emLink.js"></script>
    </head>
    <body>
        <main>
            <h1><span>Jeremy</span><span>Goldsworthy</span></h1>
            <button id="imagingB" onclick="playout('imaging');animateButton('imagingB');">
                <div class="barContainer" data-alignment="left">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <h2>Radio Imaging</h2>
                <audio src="./assets/audio/imagingJan26.mp3" id="imaging" loop>
                </audio>
                <div class="barContainer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </button>
            <button id="musicB" onclick="playout('music');animateButton('musicB')">
                <div class="barContainer" data-alignment="left">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <h2>Music</h2>
                <audio src="./assets/audio/musicJun24.mp3" id="music" loop>
                </audio>
                <div class="barContainer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </button>
            <details id="album">
                <summary>
                    <h2>Latest Album</h2>
                </summary>
                <section>
                    <iframe id="bandcampPlayer" style="width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=1069857484/size=large/bgcol=333333/linkcol=0f91ff/tracklist=false/artwork=small/transparent=true/" seamless>
                        <a href="https://jeremy-goldsworthy.bandcamp.com/album/sketchbooks">Sketchbooks by Jeremy Goldsworthy</a>
                    </iframe>
                </section>
            </details>
            <details id="photography">
                <summary>
                    <h2>Photography</h2>
                </summary>
                <picture>
                    <img src="assets/images/photography/locks.JPG" alt="Lock boxes placed on a brick surface">
                    <img src="assets/images/photography/bottle.JPG" alt="A bottle of water placed at the bank of a canal">
                    <img src="assets/images/photography/alley.JPG" alt="Signage in an urban alley way">
                    <img src="assets/images/photography/mixer.JPG" alt="An old mixing desk">
                    <img src="assets/images/photography/blossom.JPG" alt="A tree in blossom through a window">
                    <img src="assets/images/photography/train.JPG" alt="Power lines and light reflections on a train window">
                    <img src="assets/images/photography/bars.JPG" alt="Metal railings on a bridge">
                    <img src="assets/images/photography/bee.JPG" alt="A bee perched on a flower">
                    <img src="assets/images/photography/bricks.JPG" alt="The sun reflecting off a brick wall">
                </picture>
            </details>
            <details id="videos" data-hasVideoEmbeds>
                <summary>
                    <h2>Videos</h2>
                </summary>
                <div class="videoScroller">
                    <iframe data-lowRes src="https://www.youtube.com/embed/Y6S7UjxTmmc?rel=0&iv_load_policy-3"  allowfullscreen scrolling="no" allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;" referrerpolicy="strict-origin"></iframe>
                </div>
            </details>
            <details id="blinkNine" data-hasVideoEmbeds>
                <summary>
                    <h2>Blink Nine</h2>
                </summary>
                <div class="videoScroller">
                    <iframe data-lowRes src="https://www.youtube.com/embed/EYvPvaRfkZc?rel=0&iv_load_policy=3" allowfullscreen scrolling="no" allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; web-share *;" referrerpolicy="strict-origin"></iframe>
                    <iframe data-lowRes src="https://www.youtube.com/embed/2K-UCInhf1U?rel=0&iv_load_policy=3" allowfullscreen scrolling="no" allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *;  web-share *;" referrerpolicy="strict-origin"></iframe>
                    <iframe data-lowRes src="https://www.youtube.com/embed/6Lc1jmYD5fc?rel=0&iv_load_policy=3" allowfullscreen scrolling="no" allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *;  web-share *;" referrerpolicy="strict-origin"></iframe>
                </div>
            </details>
        </main>
        <footer>
            <nav>
                <button title="Square brackets '[]' added to protect address from robots, clik to copy without brackets. (or substitute the correct characters yourself)" onclick="emaLink(this)">jeremygoldsworthy [at] jlukesound [dot] co [dot] uk</button>
                <button><a href="./assets/pages/gubbins/terrarium.html" id="gubButton">gubbins</a></button>
            </nav>
        </footer>
        <script src="./assets/scripts/embedRefresh.js" defer></script>
    </body>
</html>
